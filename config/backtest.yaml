# config/backtest.yaml
# ==========================================
# 1. 回测环境配置 (Backtest Context)
# ==========================================
backtest:
  start_date: '2018-01-01'
  end_date: '2024-07-31'
  initial_capital: 1000000
  commission_rate: 0.0010
  slippage: 0.0005
  benchmark: 'SPY'
  
  # 选项: 'us_stock_top' (美股) / 'equity_us' (ETF) / 'All'
  universe: 'us_stock_top'

# ==========================================
# 2. 策略覆盖 (完全独立于回测)
# ==========================================
strategy:
  # [这里可以选] 即使 base 选了 linear，实盘也可以在这里改成 ml
  type: 'linear'  

  common:
    name: 'Live_Production_V1'
    top_k: 3                # 实盘更精简
    risk:
      stop_loss_pct: 0.05    # 实盘风控更严
      max_pos_weight: 0.3
      max_drawdown_pct: 0.15

  # 如果 type 是 linear，工厂会读取这里
  linear_params:
    weights:
      alpha013: 0.6
      rsi: 0.4

  # 如果 type 改成 ml，工厂会读取这里
  ml_params:
    model_path: 'models/prod_model_v1.pkl'
    feature_list: ['alpha013', 'rsi']